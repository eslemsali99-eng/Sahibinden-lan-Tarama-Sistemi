<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bircan Akın · Canlı İlan Tarama Sistemi</title>
<style>
  :root{ --bg:#0a0e1a; --panel:#121829; --panel2:#161d33; --line:#26304d; --txt:#eaf0fb; --mut:#8a97b8; --acc:#4f8cff; --gold:#e9c46a; --green:#2ecc71; --red:#ff5d5d; --amber:#ffb84d; --inputbg:#0c1222; --thbg:#0e1426; --hover:#141c33; --tb1:#0d1426; --tb2:#142243; --badgebg:#1f2b4d; --badgetx:#9cc0ff; }
  html.light{ --bg:#eef1f7; --panel:#ffffff; --panel2:#edf1f8; --line:#dde3ef; --txt:#1d2638; --mut:#64708a; --inputbg:#f4f7fc; --thbg:#eef2f9; --hover:#f4f8fe; --tb1:#1f3a5f; --tb2:#2a4d7a; --badgebg:#e7eefb; --badgetx:#2a5ca8; }
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px}
  ::-webkit-scrollbar{height:9px;width:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 22px;background:linear-gradient(90deg,var(--tb1),var(--tb2));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .logo{font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff}.logo b{color:var(--gold)}
  .nav{display:flex;gap:5px;margin-left:6px}
  .nav a{color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;padding:7px 13px;border-radius:8px}
  .nav a.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}.nav a:hover{color:#fff}
  .themebtn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.75);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 7px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;padding:14px 22px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  .mcard:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 6px 18px rgba(79,140,255,.12)}
  .mcard .ico{font-size:16px;opacity:.85}.mcard .num{font-size:22px;font-weight:800;margin:4px 0 1px;letter-spacing:-.4px}
  .mcard .lbl{font-size:11.5px;color:var(--mut)}
  .mcard.hot{border-color:var(--gold)}.mcard.hot .num{color:var(--gold)}
  .mcard.warn .num{color:var(--amber)} .mcard.new .num{color:var(--green)}
  .chartwrap{padding:0 22px 6px}.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .chart h4{margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:600}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
  .bar .nm{width:84px;color:var(--txt);font-weight:600} .bar .track{flex:1;background:var(--inputbg);border-radius:7px;height:16px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#4f8cff,#7db1ff);border-radius:7px;min-width:3px;transition:width .7s cubic-bezier(.3,1.2,.4,1)}
  .bar.top .fill{background:linear-gradient(90deg,var(--gold),#f4d98a)}
  .bar .v{width:84px;text-align:right;font-weight:800}.bar .v small{color:var(--mut);font-weight:600;font-size:11px;margin-inline-start:5px}
  .b-new{background:var(--green);color:#063;font-size:9.5px;padding:2px 6px;border-radius:20px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
  .b-hot{margin-inline-start:6px;font-size:13px}
  .b-dup{background:var(--amber);color:#3a2400;font-size:9.5px;padding:2px 6px;border-radius:20px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
  .meinput{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;width:120px}
  .meinput::placeholder{color:rgba(255,255,255,.6)}
  .byline{font-size:10px;color:var(--mut);margin-top:2px}
  body.no-phone .col-phone{display:none}
  td.sysdate{color:var(--badgetx);font-weight:700;white-space:nowrap}
  .tabs{display:flex;gap:7px;padding:6px 22px 0;flex-wrap:wrap}
  .tab{padding:8px 14px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;color:var(--mut);background:transparent;font-size:13px}
  .tab.active{background:var(--panel);color:var(--txt);font-weight:700}.tab.alert.active{color:var(--gold)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 22px;background:var(--panel);margin:0 22px;border-radius:0 10px 0 0;border:1px solid var(--line);border-bottom:none}
  input,select{background:var(--inputbg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none}
  input:focus,select:focus{border-color:var(--acc)} .grow{flex:1;min-width:190px}
  .wrap{padding:0 22px 50px;overflow-x:auto}
  table{width:100%;min-width:820px;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:0 0 10px 10px;overflow:hidden}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
  th{background:var(--thbg);color:var(--mut);font-weight:600;white-space:nowrap}
  tr:hover td{background:var(--hover)} img.thumb{width:84px;height:60px;object-fit:cover;border-radius:7px;background:#2a3658;display:block}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
  .b-tur{background:var(--badgebg);color:var(--badgetx)} .price{font-weight:800;white-space:nowrap;color:var(--txt)}
  .left-ok{color:var(--green);font-weight:700}.left-warn{color:var(--amber);font-weight:700}.left-crit{color:var(--red);font-weight:800}
  a.go{display:inline-block;padding:5px 10px;background:var(--acc);color:#fff;border-radius:7px;text-decoration:none;font-size:11.5px;font-weight:700;white-space:nowrap}
  a.wa{display:inline-block;padding:4px 8px;background:#25d366;color:#073;border-radius:7px;text-decoration:none;font-size:11.5px;font-weight:800;margin-inline-start:4px}
  a.title{color:var(--txt);text-decoration:none}a.title:hover{color:var(--acc)} .muted{color:var(--mut)}
  .stsel{background:var(--inputbg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11.5px}
  .pfbtn{border:none;border-radius:7px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:11.5px;background:var(--panel2);color:var(--badgetx)}.pfbtn.on{background:#2e7d32;color:#fff}
  .empty{text-align:center;padding:60px;color:var(--mut)}
  @keyframes hlflash{0%,100%{background:transparent}25%{background:rgba(233,196,106,.45)}}
  tr.hl td{animation:hlflash 2.2s ease 2}
  /* ilan detay modalı */
  .dmodal{position:fixed;inset:0;background:rgba(8,12,26,.78);z-index:80;display:none;align-items:center;justify-content:center;padding:14px}
  .dmodal.open{display:flex}
  .dsheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:880px;width:100%;max-height:92vh;overflow:auto}
  .dimgs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--tb1)}
  .dimgs img{height:210px;border-radius:8px;object-fit:cover;background:#2a3658}
  .dpad{padding:16px 22px}
  .dclose{float:right;background:var(--panel2);border:none;color:var(--txt);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;margin:8px}
  .dsheet h2{margin:2px 0;color:var(--acc);font-size:23px}
  .dgrid{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0}
  .dgrid>div b{display:block;color:var(--mut);font-size:11px;font-weight:600;margin-bottom:2px}
  .ddesc{white-space:pre-wrap;background:var(--inputbg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;max-height:260px;overflow:auto;font-size:13px;line-height:1.55}
  .dact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .dact a{padding:11px 16px;border-radius:9px;font-weight:700;text-decoration:none;font-size:13px}
  /* responsive / mobil */
  @media(max-width:760px){
    .topbar{gap:8px;padding:9px 12px;flex-wrap:wrap}.logo{font-size:13px} .nav a{padding:6px 9px;font-size:12px} .live{font-size:11px}
    .metrics{grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;padding:10px 12px} .mcard{padding:9px 11px} .mcard .num{font-size:18px}
    .chartwrap{padding:0 12px 6px} .tabs{padding:6px 12px 0} .tab{padding:7px 11px;font-size:12px}
    .toolbar{margin:0 12px;padding:10px 12px} .grow{min-width:140px} .wrap{padding:0 12px 40px}
    th,td{padding:7px 8px;font-size:11.5px} img.thumb{width:64px;height:46px}
  }
</style>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')</script>
</head>
<body>
<div class="topbar">
  <div class="logo">🏛️ Bircan <b>Akın</b> · İlan Tarama</div>
  <div class="nav">
    <a class="active" href="/">CRM</a>
    <a href="/portfolio" target="_blank">Müşteri Portföyü ↗</a>
  </div>
  <input id="me" class="meinput" placeholder="👤 Adın" />
  <button class="themebtn" id="themebtn" onclick="toggleTheme()">☀️ Açık</button>
  <div class="live"><span class="dot"></span> canlı · <span id="upd">—</span><span id="fresh"></span></div>
</div>

<div class="metrics" id="metrics"></div>
<div class="chartwrap"><div class="chart"><h4>📍 İlçe Dağılımı</h4><div id="chart"></div></div></div>

<div class="tabs">
  <button class="tab active" data-mode="all">🏠 Tüm Ev Sahibi İlanları</button>
  <button class="tab alert" data-mode="expiring">⏳ Dolmaya Yakın (25-31 gün)</button>
  <button class="tab" data-mode="new">🆕 Yeni (24 saat)</button>
  <button class="tab" data-mode="portfolio">⭐ Portföydekiler</button>
  <button class="tab alert" data-mode="removed">📭 Yayından Kalkanlar</button>
</div>
<div class="toolbar">
  <input class="grow" id="q" placeholder="🔎 başlık / mahalle ara..." />
  <select id="district"><option value="">Tüm İlçeler</option></select>
  <select id="type"><option value="">Tüm Türler</option></select>
  <select id="status"><option value="">Tüm Durumlar</option></select>
  <select id="sort">
    <option value="heat">🔥 Arama Önceliği</option>
    <option value="new">En Yeni Eklenen</option>
    <option value="days_left_asc">Kalan gün (az→çok)</option>
    <option value="price_desc">Fiyat (yüksek→düşük)</option>
    <option value="price_asc">Fiyat (düşük→yüksek)</option>
  </select>
  <span class="muted" id="count"></span>
</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th>Görsel</th><th>Tür</th><th>Başlık</th><th>Fiyat</th><th>İlçe / Mahalle</th>
      <th>m² · Oda</th><th>İlan Tarihi</th><th>Sisteme</th><th>Yaş</th><th>Kalan</th><th class="col-phone">Telefon</th><th>Durum</th><th>Teyit</th><th>Portföy</th><th>İlan</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty">Veri bekleniyor…</div>
</div>

<div class="dmodal" id="dmodal" onclick="if(event.target===this)closeDetail()"><div class="dsheet" id="dsheet"></div></div>

<script>
let MODE='all', ALL=[];
const STATUSES=['Yeni','Arandı','İzin Verdi','Reddetti','Ulaşılamadı'];
const VERIFY=['Teyit Bekliyor','Satıldı','Vazgeçti','Hâlâ Satıyor','Ulaşılamadı'];
const $=(s)=>document.querySelector(s);
function toggleTheme(){const l=document.documentElement.classList.toggle('light');localStorage.setItem('theme',l?'light':'dark');$('#themebtn').textContent=l?'🌙 Koyu':'☀️ Açık';}
if(document.documentElement.classList.contains('light'))setTimeout(()=>$('#themebtn').textContent='🌙 Koyu',0);
const fmt=(n)=>n==null||n===''?'':Number(n).toLocaleString('tr-TR');
const waLink=(p)=>{ const d=(p||'').replace(/\D/g,'').replace(/^0/,''); return d?`https://wa.me/90${d}`:''; };
const fmtDate=(iso)=>{ if(!iso)return''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit'}); };
const isNew=(x)=>x.first_seen&&(Date.now()-new Date(x.first_seen).getTime()<864e5);

let DUP=new Set();
// arama önceliği skoru (sıcaklık): dolmaya yakın + telefonlu + henüz aranmamış + yeni
function heat(x){
  if(x.removed==1) return 0;
  let s=0;
  if(x.days_on_site>=25&&x.days_on_site<=31) s+=50; else if(x.days_on_site>=20) s+=25;
  if(x.phone) s+=20;
  if((x.status||'Yeni')==='Yeni') s+=15;
  if(isNew(x)) s+=15;
  return s;
}
// aynı mülk birden çok ilanda mı? (mahalle+m²+oda+fiyat aynıysa)
function computeDups(){
  const m={}; DUP=new Set();
  ALL.forEach(x=>{ if(x.area_m2&&x.price&&x.neighborhood){ const k=`${x.neighborhood}|${x.area_m2}|${x.rooms||''}|${x.price}`; (m[k]=m[k]||[]).push(String(x.id)); }});
  Object.values(m).forEach(ids=>{ if(ids.length>1) ids.forEach(id=>DUP.add(id)); });
}
async function upd(id, field, value){
  const me=localStorage.getItem('bircan_me')||'';
  await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,fields:{[field]:value},by:me})});
  const r=ALL.find(x=>String(x.id)===String(id)); if(r){ r[field]=value; if(field==='status'||field==='verify_status'){ r.status_by=me; r.status_at=new Date().toISOString(); } }
  if(field==='shared'||field==='status'||field==='verify_status') render(); loadStats();
}
async function loadStats(){
  try{ const s=await fetch('/api/stats').then(r=>r.json());
    $('#metrics').innerHTML=[
      ['🏠',s.total,'Toplam İlan',''],['🆕',s.new24h,'Yeni (24 saat)','new'],
      ['⏳',s.expiring,'Dolmaya Yakın','hot'],['📞',s.withPhone,'Telefonlu',''],
      ['⭐',s.portfolio,'Portföyde',''],['📩',s.inquiries,'Müşteri Talebi',''],
      ['📭',s.removed,'Yayından Kalkan','warn'],['☎️',s.arananlar,'İşlenen','warn'],['🗺️',s.districts,'İlçe','']
    ].map(([i,n,l,c])=>`<div class="mcard ${c}"><div class="ico">${i}</div><div class="num">${fmt(n)}</div><div class="lbl">${l}</div></div>`).join('');
    const mx=Math.max(1,...s.byDistrict.map(d=>d.c)); const tot=s.byDistrict.reduce((a,d)=>a+d.c,0)||1;
    $('#chart').innerHTML=s.byDistrict.map(d=>`<div class="bar${d.c===mx?' top':''}"><span class="nm">${d.district}</span><span class="track"><span class="fill" style="width:${d.c/mx*100}%"></span></span><span class="v">${fmt(d.c)}<small>%${Math.round(d.c/tot*100)}</small></span></div>`).join('')||'<span class="muted">—</span>';
    if(s.lastScrape){ const h=(Date.now()-new Date(s.lastScrape).getTime())/3.6e6; const c=h<2?'var(--green)':h<24?'var(--amber)':'var(--red)'; $('#fresh').innerHTML=` · <span style="color:${c}">⟳ tarama ${h<1?Math.round(h*60)+'dk':Math.round(h)+'sa'} önce</span>`; }
  }catch(e){}
}
async function load(){
  try{ ALL=await fetch('/api/listings?seller=sahibinden').then(r=>r.json()); computeDups(); fillFilters(); render();
    $('#upd').textContent=new Date().toLocaleTimeString('tr-TR'); handleDeepLink(); }catch(e){}
  loadStats();
}
let deeplinkDone=false;
function handleDeepLink(){
  if(deeplinkDone)return; deeplinkDone=true;
  const P=new URLSearchParams(location.search), tab=P.get('tab'), id=P.get('id');
  if(tab){ const tb=document.querySelector(`.tab[data-mode="${tab}"]`); if(tb)tb.click(); }
  if(id) setTimeout(()=>{ highlightRow(id); openDetail(id); },350);
}
function highlightRow(id){
  const tr=document.querySelector(`tr[data-id="${(window.CSS&&CSS.escape)?CSS.escape(String(id)):id}"]`);
  if(tr){ tr.scrollIntoView({behavior:'smooth',block:'center'}); tr.classList.add('hl'); setTimeout(()=>tr.classList.remove('hl'),5000); }
}
// ilan detay modalı — tüm bilgiyi BİZİM sistemimizde göster (kalkanlar için kritik)
function openDetail(id){
  const x=ALL.find(r=>String(r.id)===String(id)); if(!x)return;
  let imgs=[]; try{ imgs=x.images?JSON.parse(x.images):[]; }catch(e){} if(!imgs.length&&x.image_url)imgs=[x.image_url];
  const wa=waLink(x.phone);
  const phoneHtml = x.phone
    ? `<a href="tel:${x.phone}" style="color:var(--green);font-weight:800;text-decoration:none">${x.phone}</a>${wa?` · <a class="wa" href="${wa}" target="_blank">WA</a>`:''}`
    : (x.contact_type==='message'?'<span style="color:var(--amber);font-weight:700">✉️ Telefon yok — mesajla iletişim</span>':'<span class="muted">henüz çekilmedi</span>');
  $('#dsheet').innerHTML=`
    <button class="dclose" onclick="closeDetail()">×</button>
    ${imgs.length?`<div class="dimgs">${imgs.map(u=>`<img src="${u}" referrerpolicy="no-referrer">`).join('')}</div>`:''}
    <div class="dpad">
      <h2>${x.price?fmt(x.price)+' ₺':''}</h2>
      <div class="muted">📍 ${x.district||''}${x.neighborhood?' · '+x.neighborhood:''}${x.removed==1?' · <span style="color:var(--red);font-weight:700">YAYINDAN KALKTI</span>':''}</div>
      <div class="dgrid">
        <div><b>Tür</b>${x.property_type||'-'}</div>
        <div><b>m²</b>${x.area_m2||'-'}</div>
        <div><b>Oda</b>${x.rooms||'-'}</div>
        <div><b>İlan Tarihi</b>${x.listing_date||'-'}</div>
        <div><b>Sisteme</b>${fmtDate(x.first_seen)||'-'}</div>
        <div><b>Telefon</b>${phoneHtml}</div>
        ${x.ownership_type?`<div><b>Tapu</b>${x.ownership_type}</div>`:''}
        ${x.status_by?`<div><b>Son işlem</b>${x.status_by} · ${fmtDate(x.status_at)}</div>`:''}
      </div>
      <div style="font-weight:700;font-size:14px">${x.title||''}</div>
      ${x.description?`<div class="ddesc">${(x.description||'').replace(/</g,'&lt;')}</div>`:'<div class="muted" style="margin-top:10px">Açıklama henüz çekilmedi — 7/24 detay taramasında gelecek.</div>'}
      <div class="dact">
        ${x.url?`<a href="${x.url}" target="_blank" style="background:var(--acc);color:#fff">Sahibinden'de aç ↗</a>`:''}
        ${wa?`<a href="${wa}" target="_blank" style="background:#25d366;color:#073">WhatsApp</a>`:''}
      </div>
    </div>`;
  $('#dmodal').classList.add('open');
}
function closeDetail(){ $('#dmodal').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDetail(); });
function fillFilters(){
  const d=$('#district'),t=$('#type'); const cur={d:d.value,t:t.value};
  const U=(k)=>[...new Set(ALL.map(x=>x[k]).filter(Boolean))].sort();
  d.innerHTML='<option value="">Tüm İlçeler</option>'+U('district').map(v=>`<option ${v===cur.d?'selected':''}>${v}</option>`).join('');
  t.innerHTML='<option value="">Tüm Türler</option>'+U('property_type').map(v=>`<option ${v===cur.t?'selected':''}>${v}</option>`).join('');
  if($('#status').children.length<=1) $('#status').innerHTML='<option value="">Tüm Durumlar</option>'+STATUSES.map(s=>`<option>${s}</option>`).join('');
}
function leftClass(n){return n==null?'muted':n<=3?'left-crit':n<=7?'left-warn':'left-ok'}
function render(){
  let r=ALL.slice();
  const q=$('#q').value.trim().toLowerCase(),d=$('#district').value,t=$('#type').value,st=$('#status').value,s=$('#sort').value;
  if(q)r=r.filter(x=>((x.title||'')+' '+(x.neighborhood||'')).toLowerCase().includes(q));
  if(d)r=r.filter(x=>x.district===d); if(t)r=r.filter(x=>x.property_type===t); if(st)r=r.filter(x=>(x.status||'Yeni')===st);
  if(MODE==='removed')r=r.filter(x=>x.removed==1); else r=r.filter(x=>!x.removed);
  if(MODE==='expiring')r=r.filter(x=>x.days_on_site>=25&&x.days_on_site<=31);
  if(MODE==='portfolio')r=r.filter(x=>x.shared==1);
  if(MODE==='new'){const c=Date.now()-864e5;r=r.filter(x=>x.first_seen&&new Date(x.first_seen).getTime()>=c);}
  const by={heat:(a,b)=>heat(b)-heat(a),new:(a,b)=>new Date(b.first_seen||0)-new Date(a.first_seen||0),days_left_asc:(a,b)=>(a.days_left??1e9)-(b.days_left??1e9),price_desc:(a,b)=>(b.price||0)-(a.price||0),price_asc:(a,b)=>(a.price||0)-(b.price||0)};
  r.sort(by[s]||by.heat);
  document.body.classList.toggle('no-phone', !ALL.some(x=>x.phone||x.contact_type));
  $('#count').textContent=r.length+' ilan'; $('#empty').style.display=r.length?'none':'block';
  $('#rows').innerHTML=r.map(x=>{const wa=waLink(x.phone);return `<tr data-id="${x.id}">
    <td>${x.image_url?`<img class="thumb" loading="lazy" src="${x.image_url}" referrerpolicy="no-referrer" onclick="openDetail('${x.id}')" style="cursor:pointer" title="Detay">`:`<button onclick="openDetail('${x.id}')" style="background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--mut);width:84px;height:60px;cursor:pointer" title="Detay">👁</button>`}</td>
    <td><span class="badge b-tur">${x.property_type||'-'}</span></td>
    <td><a class="title" href="${x.url}" target="_blank">${x.title||''}</a>${isNew(x)?'<span class="b-new">YENİ</span>':''}${heat(x)>=70?'<span class="b-hot" title="Arama önceliği yüksek">🔥</span>':''}${DUP.has(String(x.id))?'<span class="b-dup">⚠️ mükerrer</span>':''}</td>
    <td class="price">${x.price?fmt(x.price)+' ₺':''}</td>
    <td>${x.district||''}<div class="muted">${x.neighborhood||''}</div></td>
    <td>${x.area_m2?x.area_m2+' m²':''}${x.rooms?' · '+x.rooms:''}</td>
    <td class="muted">${x.listing_date||''}</td><td class="sysdate">${fmtDate(x.first_seen)}</td><td>${x.days_on_site??''}</td>
    <td class="${leftClass(x.days_left)}">${x.days_left??''}</td>
    <td class="col-phone">${x.phone?`<a href="tel:${x.phone}" style="color:#74e6a4;font-weight:700;text-decoration:none">${x.phone}</a>${wa?`<a class="wa" href="${wa}" target="_blank">WA</a>`:''}`:(x.contact_type==='message'?'<span style="color:var(--amber);font-weight:600" title="Sahibinden\'de telefon yok, mesajla iletişim">✉️ Mesajla</span>':'<span class="muted">—</span>')}</td>
    <td><select class="stsel" onchange="upd('${x.id}','status',this.value)">${STATUSES.map(s=>`<option ${(x.status||'Yeni')===s?'selected':''}>${s}</option>`).join('')}</select>${x.status_by?`<div class="byline">👤 ${x.status_by} · ${fmtDate(x.status_at)}</div>`:''}</td>
    <td>${x.removed==1?`<select class="stsel" onchange="upd('${x.id}','verify_status',this.value)">${VERIFY.map(v=>`<option ${(x.verify_status||'Teyit Bekliyor')===v?'selected':''}>${v}</option>`).join('')}</select>`:'<span class="muted">—</span>'}</td>
    <td><button class="pfbtn ${x.shared?'on':''}" onclick="upd('${x.id}','shared',${x.shared?0:1})">${x.shared?'✓':'+ Ekle'}</button></td>
    <td><a class="go" href="${x.url}" target="_blank">Aç ↗</a></td></tr>`}).join('');
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');MODE=b.dataset.mode;render();});
['q','district','type','status','sort'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#me').value=localStorage.getItem('bircan_me')||'';
$('#me').addEventListener('input',e=>localStorage.setItem('bircan_me',e.target.value.trim()));
load(); setInterval(load,15000);
</script>
</body>
</html>
